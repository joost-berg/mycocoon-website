name: Website preview

on:
  push:
    branches: ['feature/website']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/feature/website'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install, build and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: '24'
          package-manager: pnpm@10

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v5
